[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelproof"
version = "0.6.2"
description = "Find where your images are used online. Runs fully on your PC."
requires-python = ">=3.10"

[project.scripts]
pixelproof = "pixelproof.cli:main"

[tool.setuptools]
packages = ["pixelproof"]

[tool.setuptools.package-data]
pixelproof = ["ui/*", "ui/fonts/*", "assets/fonts/*"]
